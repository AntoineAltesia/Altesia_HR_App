<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page protégée</title>
<style>
:root{--marine:#1f3864;--fond:#f4f6fa;--carte:#fff;--bord:#c3cbdb;--texte:#16213a;--doux:#5a6a8a;--mauvais:#a32020}
@media (prefers-color-scheme:dark){:root{--marine:#9cb6e8;--fond:#11151f;--carte:#192033;--bord:#3b4866;--texte:#e8ecf6;--doux:#a3afc9;--mauvais:#f08a8a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fond);color:var(--texte);
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:24px;width:100%;max-width:370px;
 box-shadow:0 2px 6px rgba(22,33,58,.07),0 12px 34px rgba(22,33,58,.08)}
h1{font-size:17px;margin:0 0 5px}
p{color:var(--doux);font-size:13px;margin:0 0 17px}
input{width:100%;padding:10px 12px;border:1px solid var(--bord);border-radius:8px;background:var(--carte);
 color:var(--texte);font:inherit;font-size:15px}
input:focus{outline:2px solid var(--marine);outline-offset:-1px}
button{width:100%;margin-top:11px;padding:10px;border:1px solid var(--marine);background:var(--marine);
 color:var(--carte);border-radius:8px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#11151f}}
button:disabled{opacity:.5;cursor:default}
.e{color:var(--mauvais);font-size:13px;margin-top:11px;min-height:19px}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Page protégée</h1>
  <p>Saisissez le mot de passe pour afficher cette page.</p>
  <input type="password" id="m" autocomplete="current-password" autofocus aria-label="Mot de passe">
  <button type="submit" id="b">Ouvrir</button>
  <div class="e" id="e" role="alert"></div>
</form>

  for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; };
document.getElementById("f").addEventListener("submit", async function(ev){
  ev.preventDefault();
  var b = document.getElementById("b"), e = document.getElementById("e");
  var mdp = document.getElementById("m").value;
  if(!mdp) return;
  b.disabled = true; e.textContent = ""; b.textContent = "Déchiffrement…";
  try{
    if(!window.crypto || !crypto.subtle) throw new Error("indisponible");
